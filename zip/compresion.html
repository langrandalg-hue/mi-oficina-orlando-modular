<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Oficina Orlando V11.5</title><style>*{box-sizing:border-box}body{font:17px system-ui;background:#f3f5fa;color:#192b4b;margin:0;padding:18px}main{max-width:760px;margin:auto}section,article{background:white;border:1px solid #dce2eb;border-radius:18px;padding:16px;margin:14px 0}button,input,select{font:inherit;max-width:100%;margin:6px 0}button{background:#192b4b;color:white;border:0;border-radius:12px;padding:13px;width:100%}button:disabled{opacity:.5}label{display:block;margin:12px 0}input[type=number],input[type=text],select{width:100%;padding:10px}img,video{max-width:100%;max-height:320px}a{color:#245a9b}small{display:block;color:#52637b}progress{width:100%}article{overflow-wrap:anywhere}</style><main><a href="../index.html?v=115">← Volver a Mi Oficina</a><img src="../logo-orlando.png" alt="Mi Oficina Orlando" style="width:100%;max-height:150px;object-fit:contain"><small>V11.5 · Procesamiento local · No se guarda automáticamente</small><h1>Crear y descomprimir ZIP</h1><section><h2>Crear ZIP</h2><input id="files" type="file" multiple><label>Nombre<input id="name" type="text" value="mis_archivos"></label><label>Compresión<select id="level"><option value="0">Sin compresión</option><option value="6" selected>Normal</option><option value="9">Máxima</option></select></label><button id="create">Preparar ZIP</button><button id="cancel" disabled>Cancelar</button><progress id="zp" max="1" value="0"></progress><input id="more" type="file" multiple><small>Añadir más archivos</small><p id="picked"></p></section><section><h2>Descomprimir ZIP</h2><input id="archive" type="file" accept=".zip"><button id="all">Seleccionar todos</button><button id="none">Deseleccionar</button><div id="entries"></div><button id="extract">Extraer seleccionados</button></section><p id="status" role="status"></p><div id="out"></div></main><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>const $=id=>document.getElementById(id),fmt=n=>n>=1e9?(n/1e9).toFixed(2)+' GB':n>=1e6?(n/1e6).toFixed(2)+' MB':(n/1024).toFixed(1)+' KB';const status=t=>$('status').textContent=t;function result(blob,name,original,preview){let a=document.createElement('article'),url=URL.createObjectURL(blob);let check=document.createElement('input');check.type='checkbox';check.checked=true;let nm=document.createElement('input');nm.type='text';nm.value=name;let lab=document.createElement('label');lab.append(check,document.createTextNode(' Incluir en lote'));a.append(lab,nm);batch.push({c:check,blob,name:nm});check.onchange=()=>updateBatch();updateBatch();let info=document.createElement('p');info.textContent=fmt(original)+' → '+fmt(blob.size)+' · ahorro '+(original?((1-blob.size/original)*100).toFixed(1):0)+' %';a.append(info);if(preview){let m=document.createElement(preview);m.src=url;if(preview==='video'){m.controls=true;m.preload='none';m.playsInline=true}else m.loading='lazy';a.append(m)}let b=document.createElement('button');b.textContent='Compartir / Elegir dónde guardar';b.onclick=async()=>{try{let f=new File([blob],nm.value,{type:blob.type});if(!navigator.canShare?.({files:[f]}))throw Error('Usa Descargar');await navigator.share({files:[f]})}catch(e){if(e.name!=='AbortError')status(e.message)}};a.append(b);let d=document.createElement('button');d.textContent='Descargar';d.onclick=()=>{let l=document.createElement('a');l.href=url;l.download=nm.value;document.body.append(l);l.click();setTimeout(()=>l.remove(),60000)};a.append(d);$('out').append(a)}async function run(fn){let buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{await fn()}catch(e){status('Error: '+e.message)}finally{buttons.forEach(b=>b.disabled=b.id==='cancel')}}let entries=[],picked=[],cancelled=false;function showPicked(){$('picked').textContent=picked.length+' archivos · '+fmt(picked.reduce((n,f)=>n+f.size,0))} $('files').onchange=()=>{picked=[...$('files').files];showPicked()};$('more').onchange=()=>{picked.push(...$('more').files);showPicked();$('more').value=''};$('cancel').onclick=()=>{cancelled=true;status('Cancelando…')};$('create').onclick=()=>run(async()=>{let fs=picked.slice();if(!fs.length)throw Error('Selecciona archivos');cancelled=false;$('cancel').disabled=false;let total=fs.reduce((n,f)=>n+f.size,0),level=+$('level').value,used=new Set(),parts=[],central=[],offset=0;let table=Uint32Array.from({length:256},(_,i)=>{for(let j=0;j<8;j++)i=i&1?0xedb88320^(i>>>1):i>>>1;return i});function header(n){let a=new Uint8Array(n),d=new DataView(a.buffer);return {a,u:(p,v)=>d.setUint32(p,v,true),w:(p,v)=>d.setUint16(p,v,true)}}try{if(total>=3900000000||fs.length>=65535)throw Error('ZIP clásico: máximo aproximado 3,9 GB y 65534 archivos');for(let i=0;i<fs.length;i++){let f=fs[i],n=f.name,k=1;while(used.has(n))n=(k++)+'_'+f.name;used.add(n);status('Leyendo '+(i+1)+' de '+fs.length+': '+f.name);let crc=0xffffffff;try{for(let pos=0;pos<f.size;pos+=1048576){if(cancelled)throw Error('Cancelado');let a=new Uint8Array(await f.slice(pos,pos+1048576).arrayBuffer());for(let b of a)crc=table[(crc^b)&255]^(crc>>>8);await new Promise(r=>setTimeout(r,0))}}catch(e){throw Error(f.name+': '+e.message+' · Si el archivo está en iCloud o en un pendrive, copia primero a En mi iPhone y vuelve a seleccionarlo.')}crc=(crc^0xffffffff)>>>0;let data=f,method=0;if(level&&f.size<16000000&&!/\.(mp4|mov|jpg|jpeg|png|heic|zip|mp3|webp)$/i.test(n)){let z=new JSZip();z.file('x',f);let a=await z.generateAsync({type:'uint8array',compression:'DEFLATE',compressionOptions:{level}});let d=new DataView(a.buffer,a.byteOffset,a.byteLength),len=d.getUint32(18,true),pos=30+d.getUint16(26,true)+d.getUint16(28,true);if(len<f.size){data=new Blob([a.slice(pos,pos+len)]);method=8}}let name=new TextEncoder().encode(n),h=header(30),c=header(46);h.u(0,0x04034b50);h.w(4,20);h.w(6,2048);h.w(8,method);h.w(12,33);h.u(14,crc);h.u(18,data.s holder);$('entries').append(l);entries.push({e,c})}status(entries.length+' archivos disponibles')});$('all').onclick=()=>entries.forEach(x=>x.c.checked=true);$('none').onclick=()=>entries.forEach(x=>x.c.checked=false);$('extract').onclick=()=>run(async()=>{let selected=entries.filter(x=>x.c.checked);if(!selected.length)throw Error('Selecciona archivos');for(let {e} of selected){let b=await e.async('blob');result(b,e.name.split('/').pop(),b.size,/\.(jpg|jpeg|png|gif|webp)$/i.test(e.name)?'img':/\.(mp4|mov|webm)$/i.test(e.name)?'video':null)}status('Archivos preparados para guardar individualmente')});
let batch=[];function batchUI(){let panel=document.createElement('section');panel.innerHTML='<h2>Guardar o compartir resultados</h2><p id="count"></p><button id="selall">Seleccionar todos</button><button id="selnone">Deseleccionar</button><button id="sharebatch">Compartir seleccionados</button>'; $('out').before(panel);function update(){ $('count').textContent=batch.filter(x=>x.c.checked).length+' de '+batch.length+' seleccionados';} window.updateBatch=update; $('selall').onclick=()=>{batch.forEach(x=>x.c.checked=true);update()};$('selnone').onclick=()=>{batch.forEach(x=>x.c.checked=false);update()};$('sharebatch').onclick=async()=>{try{let files=batch.filter(x=>x.c.checked).map(x=>new File([x.blob],x.name.value,{type:x.blob.type}));if(!files.length)throw Error('Selecciona resultados');if(!navigator.canShare?.({files}))throw Error('iOS no admite este lote. Selecciona menos archivos.');await navigator.share({files})}catch(e){if(e.name!=='AbortError')status(e.message)}};update()}
