<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Oficina Orlando V11.2</title><style>*{box-sizing:border-box}body{font:17px system-ui;background:#f3f5fa;color:#192b4b;margin:0;padding:18px}main{max-width:760px;margin:auto}section,article{background:white;border:1px solid #dce2eb;border-radius:18px;padding:16px;margin:14px 0}button,input,select{font:inherit;max-width:100%;margin:6px 0}button{background:#192b4b;color:white;border:0;border-radius:12px;padding:13px;width:100%}button:disabled{opacity:.5}label{display:block;margin:12px 0}input[type=number],input[type=text],select{width:100%;padding:10px}img,video{max-width:100%;max-height:320px}a{color:#245a9b}small{display:block;color:#52637b}progress{width:100%}article{overflow-wrap:anywhere}</style><main><a href="../index.html?v=112">← Volver a Mi Oficina</a><img src="../logo-orlando.png" alt="Mi Oficina Orlando" style="width:100%;max-height:150px;object-fit:contain"><small>V11.2 · Procesamiento local · No se guarda automáticamente</small><h1>Crear y descomprimir ZIP</h1><section><h2>Crear ZIP</h2><input id="files" type="file" multiple><label>Nombre<input id="name" type="text" value="mis_archivos"></label><label>Compresión<select id="level"><option value="0">Sin compresión</option><option value="6" selected>Normal</option><option value="9">Máxima</option></select></label><button id="create">Preparar ZIP</button></section><section><h2>Descomprimir ZIP</h2><input id="archive" type="file" accept=".zip"><button id="all">Seleccionar todos</button><button id="none">Deseleccionar</button><div id="entries"></div><button id="extract">Extraer seleccionados</button></section><p id="status" role="status"></p><div id="out"></div></main><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>const $=id=>document.getElementById(id),fmt=n=>n>=1e9?(n/1e9).toFixed(2)+' GB':n>=1e6?(n/1e6).toFixed(2)+' MB':(n/1024).toFixed(1)+' KB';const status=t=>$('status').textContent=t;function result(blob,name,original,preview){let a=document.createElement('article'),url=URL.createObjectURL(blob);a.textContent=name;let info=document.createElement('p');info.textContent=fmt(original)+' → '+fmt(blob.size)+' · ahorro '+(original?((1-blob.size/original)*100).toFixed(1):0)+' %';a.append(info);if(preview){let m=document.createElement(preview);m.src=url;if(preview==='video')m.controls=true;a.append(m)}let b=document.createElement('button');b.textContent='Compartir / Elegir dónde guardar';b.onclick=async()=>{try{let f=new File([blob],name,{type:blob.type});if(!navigator.canShare?.({files:[f]}))throw Error('Usa Descargar');await navigator.share({files:[f]})}catch(e){if(e.name!=='AbortError')status(e.message)}};a.append(b);let d=document.createElement('button');d.textContent='Descargar';d.onclick=()=>{let l=document.createElement('a');l.href=url;l.download=name;l.click()};a.append(d);$('out').append(a)}async function run(fn){let buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{await fn()}catch(e){status('Error: '+e.message)}finally{buttons.forEach(b=>b.disabled=false)}}let entries=[];$('create').onclick=()=>run(async()=>{let fs=[...$('files').files];if(!fs.length)throw Error('Selecciona archivos');let z=new JSZip(),used=new Set();for(let f of fs){let n=f.name,i=1;while(used.has(n))n=(i++)+'_'+f.name;used.add(n);z.file(n,f)}let level=+$('level').value;let b=await z.generateAsync({type:'blob',compression:level?'DEFLATE':'STORE',compressionOptions:{level:level||6}},m=>status('Preparando '+Math.round(m.percent)+' %'));result(b,($('name').value.trim()||'mis_archivos').replace(/\.zip$/i,'')+'.zip',fs.reduce((a,f)=>a+f.size,0));status('ZIP preparado. Revisa y guarda.')});$('archive').onchange=()=>run(async()=>{entries=[];$('entries').replaceChildren();let f=$('archive').files[0];if(!f)return;let z=await JSZip.loadAsync(f);for(let e of Object.values(z.files).filter(e=>!e.dir)){let l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=true;l.append(c,document.createTextNode(' '+e.name));$('entries').append(l);entries.push({e,c})}status(entries.length+' archivos disponibles')});$('all').onclick=()=>entries.forEach(x=>x.c.checked=true);$('none').onclick=()=>entries.forEach(x=>x.c.checked=false);$('extract').onclick=()=>run(async()=>{let selected=entries.filter(x=>x.c.checked);if(!selected.length)throw Error('Selecciona archivos');for(let {e} of selected){let b=await e.async('blob');result(b,e.name.split('/').pop(),b.size,/\.(jpg|jpeg|png|gif|webp)$/i.test(e.name)?'img':null)}status('Archivos preparados para guardar individualmente')});</script></html>
