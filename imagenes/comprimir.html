<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Oficina Orlando V11.7</title><style>*{box-sizing:border-box}body{font:17px system-ui;background:#f3f5fa;color:#192b4b;margin:0;padding:18px}main{max-width:760px;margin:auto}section,article{background:white;border:1px solid #dce2eb;border-radius:18px;padding:16px;margin:14px 0}button,input,select{font:inherit;max-width:100%;margin:6px 0}button{background:#192b4b;color:white;border:0;border-radius:12px;padding:13px;width:100%}button:disabled{opacity:.5}label{display:block;margin:12px 0}input[type=number],input[type=text],select{width:100%;padding:10px}img,video{max-width:100%;max-height:320px}a{color:#245a9b}small{display:block;color:#52637b}progress{width:100%}article{overflow-wrap:anywhere}</style><main><a href="../index.html?v=117">← Volver a Mi Oficina</a><img src="../logo-orlando.png" alt="Mi Oficina Orlando" style="width:100%;max-height:150px;object-fit:contain"><small>V11.7 · Procesamiento local · No se guarda automáticamente</small><h1>Comprimir imágenes</h1><section><input id="files" type="file" multiple accept="image/*,.heic,.heif"><label>Calidad JPG (%)<input id="quality" type="number" min="10" max="100" value="85"></label><label>Lado máximo en píxeles (0 = original)<input id="size" type="number" min="0" value="0"></label><button id="go">Comprimir fotografías</button></section><p id="status"></p><div id="out"></div></main><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>const $=id=>document.getElementById(id),fmt=n=>n>=1e9?(n/1e9).toFixed(2)+' GB':n>=1e6?(n/1e6).toFixed(2)+' MB':(n/1024).toFixed(1)+' KB';const status=t=>$('status').textContent=t;function result(blob,name,original,preview){let a=document.createElement('article'),url=URL.createObjectURL(blob);let check=document.createElement('input');check.type='checkbox';check.checked=true;let nm=document.createElement('input');nm.type='text';nm.value=name;let lab=document.createElement('label');lab.append(check,document.createTextNode(' Incluir en lote'));a.append(lab,nm);batch.push({c:check,blob,name:nm,original});check.onchange=()=>updateBatch();updateBatch();let info=document.createElement('p');info.textContent=fmt(original)+' → '+fmt(blob.size)+' · ahorro '+(original?((1-blob.size/original)*100).toFixed(1):0)+' %';a.append(info);if(preview){let m=document.createElement(preview);m.src=url;if(preview==='video'){m.controls=true;m.preload='none';m.playsInline=true}else m.loading='lazy';m.decoding='async';a.append(m)}let b=document.createElement('button');b.textContent='Compartir / Elegir dónde guardar';b.onclick=async()=>{try{let f=new File([blob],nm.value,{type:blob.type});if(!navigator.canShare?.({files:[f]}))throw Error('Usa Descargar');await navigator.share({files:[f]})}catch(e){if(e.name!=='AbortError')status(e.message)}};a.append(b);let d=document.createElement('button');d.textContent='Descargar';d.onclick=()=>{let l=document.createElement('a');l.href=url;l.download=nm.value;document.body.append(l);l.click();setTimeout(()=>l.remove(),60000)};a.append(d);$('out').append(a);let x=batch[batch.length-1];if(!restoring){x.cacheId=crypto.randomUUID?.()||String(Date.now()+Math.random());cachePut(x).catch(()=>{status('Copia temporal no disponible; conserva esta página abierta.')})}nm.onchange=()=>{if(x.cacheId)cachePut(x).catch(()=>{})}}async function run(fn){let buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{await fn()}catch(e){status('Error: '+e.message)}finally{buttons.forEach(b=>b.disabled=false)}}$('go').onclick=()=>run(async()=>{let fs=[...$('files').files];if(!fs.length)throw Error('Selecciona fotografías');for(let f of fs){let url=URL.createObjectURL(f);try{status('Procesando '+f.name);let im=new Image();im.src=url;await im.decode();let max=Math.max(0,+$('size').value),ratio=max?Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)):1;let c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*ratio));c.height=Math.max(1,Math.round(im.naturalHeight*ratio));let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);let b=await new Promise(r=>c.toBlob(r,'image/jpeg',Math.max(.1,Math.min(1,+$('quality').value/100))));if(!b)throw Error('No se pudo codificar');if(b.size>=f.size){result(f,f.name,f.size,'img');$('out').lastElementChild.append('Original conservado: no se consiguió reducir el tamaño.')}else result(b,f.name.replace(/\.[^.]+$/,'')+'_comprimida.jpg',f.size,'img');c.width=c.height=1}catch(e){let a=document.createElement('p');a.textContent=f.name+': '+e.message+'. Si es HEIC, conviértelo primero a JPG.';$('out').append(a)}finally{URL.revokeObjectURL(url)}}status('Proceso terminado. Revisa los resultados.')});
let batch=[];function batchUI(){let panel=document.createElement('section');panel.innerHTML='<h2>Guardar o compartir resultados</h2><p id="count"></p><button id="selall">Seleccionar todos</button><button id="selnone">Deseleccionar</button><label>Fotografías por bloque<select id="blocksize"><option>10</option><option>20</option><option selected>30</option><option>50</option></select></label><label>Peso máximo por bloque (MB)<select id="blockmb"><option>30</option><option>60</option><option selected>100</option><option>150</option></select></label><small>iOS puede recordar la última carpeta; la aplicación no puede elegirla automáticamente.</small><button id="sharebatch">Compartir siguiente bloque</button><button id="zipblock">Guardar siguiente bloque en ZIP</button><button id="zipall">Preparar ZIP de todas las pendientes</button><div id="zipready"></div><button id="confirmblock" disabled>Confirmar bloque guardado</button><small id="blockinfo">Hasta 10 fotos o 30 MB por bloque. Confirma después de guardar.</small><button id="clearcache">Borrar copia temporal</button>'; $('out').before(panel);for(let id of ['blocksize','blockmb']){let el=$(id);try{let v=localStorage.getItem('orlando-'+id);if([...el.options].some(o=>o.value===v))el.value=v}catch(e){}el.onchange=()=>{try{localStorage.setItem('orlando-'+id,el.value)}catch(e){}showBlock()}}function update(){ $('count').textContent=batch.filter(x=>x.c.checked).length+' de '+batch.length+' seleccionados';let a=batch.filter(x=>x.c.checked),o=a.reduce((n,x)=>n+x.original,0),b=a.reduce((n,x)=>n+x.blob.size,0);$('count').textContent+=' · '+fmt(o)+' → '+fmt(b)+' · ahorro '+(o?((1-b/o)*100).toFixed(1):0)+' %';} window.updateBatch=()=>{update();showBlock()}; $('selall').onclick=()=>{batch.forEach(x=>{x.c.checked=!x.sent});update();showBlock()};$('selnone').onclick=()=>{batch.forEach(x=>x.c.checked=false);update();showBlock()};let pending=[];function nextBlock(){let a=[],size=0;for(let x of batch.filter(x=>x.c.checked&&!x.sent)){if(a.length&&(a.length>=Number($('blocksize').value)||size+x.blob.size>Number($('blockmb').value)*1000000))break;a.push(x);size+=x.blob.size}return a}function showBlock(){let left=batch.filter(x=>x.c.checked&&!x.sent).length;$('blockinfo').textContent=batch.filter(x=>x.sent).length+' guardadas · '+left+' seleccionadas pendientes · máximo '+$('blocksize').value+' fotos o '+$('blockmb').value+' MB por bloque (una foto grande se envía sola).';}function prepare(){if(pending.length)throw Error('Confirma el bloque anterior o vuelve a compartirlo.');let a=nextBlock();if(!a.length)throw Error('No quedan fotos seleccionadas pendientes');return a}function mark(a){pending=a;$('confirmblock').disabled=false;status('Confirma únicamente cuando hayas guardado el bloque.')} $('sharebatch').onclick=async()=>{try{clearZip();let a=pending.length?pending:prepare(),files=a.map(x=>new File([x.blob],x.name.value,{type:x.blob.type}));if(!navigator.canShare?.({files}))throw Error('Usa Guardar siguiente bloque en ZIP');await navigator.share({files});mark(a)}catch(e){if(e.name!=='AbortError')status(e.message)}};let zipUrl=null,zipBusy=false;function clearZip(){if(zipUrl)URL.revokeObjectURL(zipUrl);zipUrl=null;$('zipready').replaceChildren()}async function prepareZip(all){if(zipBusy)return;zipBusy=true;let controls=['go','sharebatch','zipblock','zipall','confirmblock','selall','selnone'].map($),prior=controls.map(b=>b.disabled);controls.forEach(b=>b.disabled=true);try{if(all&&pending.length)throw Error('Confirma primero el bloque anterior');let a=all?batch.filter(x=>x.c.checked&&!x.sent):(pending.length?pending:prepare());if(!a.length)throw Error('No quedan fotos pendientes');let total=a.reduce((n,x)=>n+x.blob.size,0);if(all&&total>100000000&&!confirm('ZIP de '+fmt(total)+'. Puede superar la memoria disponible en iPhone. ¿Continuar?'))return;clearZip();let z=new JSZip(),used=new Set();for(let x of a){let original=x.name.value.replace(/[\\/]/g,'_')||'foto.jpg',n=original,k=1;while(used.has(n))n=(k++)+'_'+original;used.add(n);z.file(n,x.blob)}let b=await z.generateAsync({type:'blob',compression:'STORE'},p=>status('Preparando ZIP: '+Math.round(p.percent)+' %'));zipUrl=URL.createObjectURL(b);let l=document.createElement('a');l.href=zipUrl;l.download='fotos_'+Date.now()+'.zip';l.textContent='Guardar ZIP preparado ('+fmt(b.size)+')';l.style.display='block';l.onclick=()=>mark(a);let share=document.createElement('button');share.textContent='Compartir ZIP / Elegir dónde guardar';share.onclick=async()=>{try{let f=new File([b],l.download,{type:'application/zip'});if(!navigator.canShare?.({files:[f]}))throw Error('Usa Guardar ZIP preparado');await navigator.share({files:[f]});mark(a)}catch(e){if(e.name!=='AbortError')status(e.message)}};$('zipready').append(l,share);status('ZIP preparado. Guarda o comparte y después confirma.')}catch(e){status('Error ZIP: '+e.message)}finally{zipBusy=false;controls.forEach((b,i)=>b.disabled=prior[i])}}$('zipblock').onclick=()=>prepareZip(false);$('zipall').onclick=()=>prepareZip(true);$('confirmblock').onclick=()=>{pending.forEach(x=>{x.sent=true;x.c.checked=false;if(x.cacheId)cachePut(x).catch(()=>{})});pending=[];clearZip();$('confirmblock').disabled=true;update();showBlock()};$('clearcache').onclick=async()=>{if(!confirm('¿Borrar la copia temporal? Los resultados de esta página seguirán disponibles hasta cerrarla.'))return;try{let db=await cacheDB();await new Promise((r,j)=>{let t=db.transaction('photos','readwrite');t.objectStore('photos').clear();t.oncomplete=r;t.onerror=j});status('Copia temporal borrada. Resultados actuales intactos.')}catch(e){status('No se pudo borrar copia temporal')}};showBlock();update()}
let restoring=false;let dbPromise;function cacheDB(){return dbPromise||(dbPromise=new Promise((r,j)=>{let q=indexedDB.open('orlando-photo-results-v116',1);q.onupgradeneeded=()=>q.result.createObjectStore('photos',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)}))}async function cachePut(x){let db=await cacheDB();return new Promise((r,j)=>{let t=db.transaction('photos','readwrite');t.objectStore('photos').put({id:x.cacheId,blob:x.blob,name:x.name.value,original:x.original,sent:!!x.sent});t.oncomplete=r;t.onerror=()=>j(t.error);t.onabort=()=>j(t.error)})}batchUI();(async()=>{try{let db=await cacheDB(),a=await new Promise((r,j)=>{let q=db.transaction('photos').objectStore('photos').getAll();q.onsuccess=()=>r(q.result);q.onerror=j});if(a.length&&confirm('¿Recuperar '+a.length+' fotografías de la copia temporal anterior?')){restoring=true;for(let x of a){result(x.blob,x.name,x.original,'img');let y=batch[batch.length-1];y.cacheId=x.id;y.sent=x.sent;y.c.checked=!x.sent}restoring=false;updateBatch()}}catch(e){status('Almacenamiento temporal no disponible')}})();</script></html>
