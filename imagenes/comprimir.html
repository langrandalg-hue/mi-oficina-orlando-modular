<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Oficina Orlando V11.5</title><style>*{box-sizing:border-box}body{font:17px system-ui;background:#f3f5fa;color:#192b4b;margin:0;padding:18px}main{max-width:760px;margin:auto}section,article{background:white;border:1px solid #dce2eb;border-radius:18px;padding:16px;margin:14px 0}button,input,select{font:inherit;max-width:100%;margin:6px 0}button{background:#192b4b;color:white;border:0;border-radius:12px;padding:13px;width:100%}button:disabled{opacity:.5}label{display:block;margin:12px 0}input[type=number],input[type=text],select{width:100%;padding:10px}img,video{max-width:100%;max-height:320px}a{color:#245a9b}small{display:block;color:#52637b}progress{width:100%}article{overflow-wrap:anywhere}</style><main><a href="../index.html?v=115">← Volver a Mi Oficina</a><img src="../logo-orlando.png" alt="Mi Oficina Orlando" style="width:100%;max-height:150px;object-fit:contain"><small>V11.5 · Procesamiento local · No se guarda automáticamente</small><h1>Comprimir imágenes</h1><section><input id="files" type="file" multiple accept="image/*,.heic,.heif"><label>Calidad JPG (%)<input id="quality" type="number" min="10" max="100" value="85"></label><label>Lado máximo en píxeles (0 = original)<input id="size" type="number" min="0" value="0"></label><button id="go">Comprimir fotografías</button></section><p id="status"></p><div id="out"></div></main><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>const $=id=>document.getElementById(id),fmt=n=>n>=1e9?(n/1e9).toFixed(2)+' GB':n>=1e6?(n/1e6).toFixed(2)+' MB':(n/1024).toFixed(1)+' KB';const status=t=>$('status').textContent=t;function result(blob,name,original,preview){let a=document.createElement('article'),url=URL.createObjectURL(blob);let check=document.createElement('input');check.type='checkbox';check.checked=true;let nm=document.createElement('input');nm.type='text';nm.value=name;let lab=document.createElement('label');lab.append(check,document.createTextNode(' Incluir en lote'));a.append(lab,nm);batch.push({c:check,blob,name:nm,original});check.onchange=()=>updateBatch();updateBatch();let info=document.createElement('p');info.textContent=fmt(original)+' → '+fmt(blob.size)+' · ahorro '+(original?((1-blob.size/original)*100).toFixed(1):0)+' %';a.append(info);if(preview){let m=document.createElement(preview);m.src=url;if(preview==='video'){m.controls=true;m.preload='none';m.playsInline=true}else m.loading='lazy';a.append(m)}let b=document.createElement('button');b.textContent='Compartir / Elegir dónde guardar';b.onclick=async()=>{try{let f=new File([blob],nm.value,{type:blob.type});if(!navigator.canShare?.({files:[f]}))throw Error('Usa Descargar');await navigator.share({files:[f]})}catch(e){if(e.name!=='AbortError')status(e.message)}};a.append(b);let d=document.createElement('button');d.textContent='Descargar';d.onclick=()=>{let l=document.createElement('a');l.href=url;l.download=nm.value;document.body.append(l);l.click();setTimeout(()=>l.remove(),60000)};a.append(d);$('out').append(a)}async function run(fn){let buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{await fn()}catch(e){status('Error: '+e.message)}finally{buttons.forEach(b=>b.disabled=false)}}$('go').onclick=()=>run(async()=>{let fs=[...$('files').files];if(!fs.length)throw Error('Selecciona fotografías');for(let f of fs){let url=URL.createObjectURL(f);try{status('Procesando '+f.name);let im=new Image();im.src=url;await im.decode();let max=Math.max(0,+$('size').value),ratio=max?Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)):1;let c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*ratio));c.height=Math.max(1,Math.round(im.naturalHeight*ratio));let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);let b=await new Promise(r=>c.toBlob(r,'image/jpeg',Math.max(.1,Math.min(1,+$('quality').value/100))));if(!b)throw Error('No se pudo codificar');if(b.size>=f.size){result(f,f.name,f.size,'img');$('out').lastElementChild.append('Original conservado: no se consiguió reducir el tamaño.')}else result(b,f.name.replace(/\.[^.]+$/,'')+'_comprimida.jpg',f.size,'img');c.width=c.height=1}catch(e){let a=document.createElement('p');a.textContent=f.name+': '+e.message+'. Si es HEIC, conviértelo primero a JPG.';$('out').append(a)}finally{URL.revokeObjectURL(url)}}status('Proceso terminado. Revisa los resultados.')});
let batch=[];function batchUI(){let panel=document.createElement('section');panel.innerHTML='<h2>Guardar o compartir resultados</h2><p id="count"></p><button id="selall">Seleccionar todos</button><button id="selnone">Deseleccionar</button><button id="sharebatch">Compartir seleccionados</button>'; $('out').before(panel);function update(){ $('count').textContent=batch.filter(x=>x.c.checked).length+' de '+batch.length+' seleccionados';let a=batch.filter(x=>x.c.checked),o=a.reduce((n,x)=>n+x.original,0),b=a.reduce((n,x)=>n+x.blob.size,0);$('count').textContent+=' · '+fmt(o)+' → '+fmt(b)+' · ahorro '+(o?((1-b/o)*100).toFixed(1):0)+' %';} window.updateBatch=update; $('selall').onclick=()=>{batch.forEach(x=>x.c.checked=true);update()};$('selnone').onclick=()=>{batch.forEach(x=>x.c.checked=false);update()};$('sharebatch').onclick=async()=>{try{let files=batch.filter(x=>x.c.checked).map(x=>new File([x.blob],x.name.value,{type:x.blob.type}));if(!files.length)throw Error('Selecciona resultados');if(!navigator.canShare?.({files}))throw Error('iOS no admite este lote. Selecciona menos archivos.');await navigator.share({files})}catch(e){if(e.name!=='AbortError')status(e.message)}};update()}
batchUI();</script></html>
