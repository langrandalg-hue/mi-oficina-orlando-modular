<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actualizador Audio Orlando</title><style>body{font:17px -apple-system,Arial,sans-serif;max-width:680px;margin:30px auto;padding:16px;color:#172b4d}button{padding:16px;border:0;border-radius:12px;background:#172b4d;color:white;font-size:17px}p{line-height:1.5}#status{white-space:pre-wrap}</style></head><body><h1>Mi Oficina · Integración MP3 y M4A</h1><p>Este actualizador toma el módulo Audio original desde GitHub Pages y genera una versión completa con MP3 y M4A, conservando el resto de funciones.</p><button id="go">Preparar archivo actualizado</button><p id="status"></p><script>
const codecs="async function orlandoEncodeMp3(b){\n if(!window.lamejs?.Mp3Encoder)await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js';s.onload=resolve;s.onerror=()=>reject(Error('No se pudo cargar el codificador MP3'));document.head.append(s)});\n const rate=44100,ch=Math.min(2,b.numberOfChannels),off=new OfflineAudioContext(ch,Math.ceil(b.duration*rate),rate),src=off.createBufferSource();src.buffer=b;src.connect(off.destination);src.start();const pcm=await off.startRendering(),enc=new lamejs.Mp3Encoder(ch,rate,128),parts=[];\n function pcm16(a,from,to){const out=new Int16Array(to-from);for(let i=from;i<to;i++){const x=Math.max(-1,Math.min(1,a[i]));out[i-from]=x<0?x*32768:x*32767}return out}\n for(let i=0;i<pcm.length;i+=1152){const end=Math.min(i+1152,pcm.length),l=pcm16(pcm.getChannelData(0),i,end),r=ch===2?pcm16(pcm.getChannelData(1),i,end):null,chunk=ch===2?enc.encodeBuffer(l,r):enc.encodeBuffer(l);if(chunk.length)parts.push(new Uint8Array(chunk))}const tail=enc.flush();if(tail.length)parts.push(new Uint8Array(tail));return new Blob(parts,{type:'audio/mpeg'});\n}\nasync function orlandoEncodeM4a(b){\n const mime=['audio/mp4;codecs=mp4a.40.2','audio/mp4'].find(t=>window.MediaRecorder?.isTypeSupported?.(t));if(!mime)throw Error('Safari no admite M4A en este dispositivo');\n const ac=new (window.AudioContext||window.webkitAudioContext)({sampleRate:b.sampleRate}),dest=ac.createMediaStreamDestination(),src=ac.createBufferSource();src.buffer=b;src.connect(dest);const rec=new MediaRecorder(dest.stream,{mimeType:mime,audioBitsPerSecond:128000}),parts=[];\n try{await ac.resume();const done=new Promise((resolve,reject)=>{rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};rec.onerror=e=>reject(e.error||Error('Error de codificación M4A'));rec.onstop=resolve});rec.start();src.start();src.onended=()=>{if(rec.state!=='inactive')rec.stop()};await done;const blob=new Blob(parts,{type:'audio/mp4'});if(!blob.size)throw Error('Safari no produjo audio M4A');return blob}finally{try{src.stop()}catch(e){}dest.stream.getTracks().forEach(t=>t.stop());await ac.close()}\n}\n";
const newExport="async function exportFinal(){const b=currentBuffer();if(!b){note('Selecciona primero un audio.');return}const f=originalFile||$('files').files[0],raw=$('audioFilename')?.value?.trim()||base(f?.name||'audio')+'_editado',format=$('audioFormat')?.value||'wav',name=raw.replace(/[\\\\/:*?\"<>|]/g,'_').replace(/\\.(wav|mp3|m4a)$/i,'').slice(0,100)||'audio_editado',btn=$('audioExport');btn.disabled=true;note('Codificando '+format.toUpperCase()+'…');try{const blob=format==='mp3'?await orlandoEncodeMp3(b):format==='m4a'?await orlandoEncodeM4a(b):wav(b,0,b.duration);$('results').replaceChildren();saveResult(blob,name+'.'+format);note('Audio final listo para escuchar, guardar o compartir.')}catch(e){note('No se pudo exportar: '+e.message)}finally{btn.disabled=false}}\n";
document.getElementById('go').onclick=async()=>{const status=document.getElementById('status');status.textContent='Leyendo el módulo original…';try{
const url='https://langrandalg-hue.github.io/mi-oficina-orlando-modular/audio/audio-v91.js?upgrade='+Date.now();const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw Error('No se pudo leer el archivo original ('+res.status+')');let s=await res.text();
const oldOptions='<option value="mp3" disabled>MP3 (pendiente de codificador)</option><option value="m4a" disabled>M4A (pendiente de codificador)</option>';
if(!s.includes(oldOptions))throw Error('La versión original ha cambiado. No se ha modificado nada.');s=s.replace(oldOptions,'<option value="mp3">MP3 · 128 kb/s</option><option value="m4a">M4A · AAC (si Safari lo admite)</option>');
const start=s.indexOf('function exportFinal(){'),end=s.indexOf('async function edit()',start);if(start<0||end<0)throw Error('No se localiza la función original de exportación.');s=s.slice(0,start)+codecs+'\n'+newExport+'\n'+s.slice(end);
s=s.replace('Convierte a WAV PCM. MP3 y M4A de salida requieren codificadores no incluidos.','Convierte a WAV, MP3 o M4A (AAC compatible con Safari).');
const blob=new Blob([s],{type:'text/javascript;charset=utf-8'}),a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='audio-v91.js';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);status.textContent='Archivo audio-v91.js generado. Antes de publicarlo, guarda una copia del original y súbelo únicamente a la carpeta audio del repositorio.';
}catch(e){status.textContent='No se ha generado el archivo: '+e.message}}
</script></body></html>
